<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — ARC Journals</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { font-family: 'Inter', sans-serif; background: #f4f6fb; margin: 0; }
  .al-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
  .al-card { width: 100%; max-width: 400px; background: #fff; border: 1px solid #e6e8ee; border-radius: 14px;
    padding: 2rem; box-shadow: 0 10px 34px rgba(20,30,60,.12); }
  .al-card .al-icon { width: 52px; height: 52px; border-radius: 12px; background: #1f3d7a; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 1.3rem; margin-bottom: 1rem; }
  .al-card h1 { margin: 0 0 .3rem; font-size: 1.3rem; color: #1c2b4a; }
  .al-card .al-sub { margin: 0 0 1.4rem; color: #66707f; font-size: .86rem; line-height: 1.6; }
  .al-fg { display: flex; flex-direction: column; margin-bottom: 1rem; }
  .al-fg label { font-weight: 600; font-size: .84rem; margin-bottom: .38rem; color: #25355a; }
  .al-fg input { width: 100%; padding: .72rem .9rem; border: 1px solid #d3d8e2; border-radius: 9px;
    font: inherit; font-size: .93rem; background: #fbfcfe; color: #222; box-sizing: border-box; transition: border-color .15s, box-shadow .15s; }
  .al-fg input:focus { outline: none; border-color: #1f3d7a; box-shadow: 0 0 0 3px rgba(31,61,122,.12); background: #fff; }
  .al-btn { width: 100%; border: 0; background: #1f3d7a; color: #fff; font: 600 .95rem 'Inter', sans-serif;
    padding: .8rem 1rem; border-radius: 9px; cursor: pointer; transition: background .15s; display: inline-flex;
    align-items: center; justify-content: center; gap: .5rem; }
  .al-btn:hover { background: #16305f; } .al-btn:disabled { opacity: .65; cursor: default; }
  .al-status { display: none; margin-top: 1rem; padding: .8rem 1rem; border-radius: 10px; font-size: .87rem; line-height: 1.6; }
  .al-status.error { display: block; background: #fdeeee; border: 1px solid #f2c2c2; color: #b91c1c; }
  .al-status.info { display: block; background: #eef2fa; border: 1px solid #cdd9f0; color: #1f3d7a; }
  .al-status a { color: inherit; font-weight: 700; }
  .al-back { text-align: center; margin-top: 1.2rem; font-size: .84rem; color: #8a92a1; }
  .al-back a { color: #1f3d7a; font-weight: 600; text-decoration: none; } .al-back a:hover { text-decoration: underline; }
  .al-loading { text-align: center; color: #66707f; font-size: .9rem; padding: .6rem 0 .4rem; }
  .al-loading i { color: #1f3d7a; display: block; font-size: 1.5rem; margin-bottom: .5rem; }
</style>
</head>
<body>
<div class="al-page">
  <div class="al-card">
    <div class="al-icon"><i class="fas fa-shield-alt"></i></div>
    <h1>Admin Login</h1>
    <p class="al-sub">This area is reserved for the site administrators. Regular author accounts cannot open the admin panel.</p>

    <div class="al-loading" id="alLoading"><i class="fas fa-circle-notch fa-spin"></i>Checking your session...</div>

    <form id="loginForm" style="display:none" novalidate>
      <div class="al-fg">
        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" placeholder="admin@example.com" autocomplete="email">
      </div>
      <div class="al-fg">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Your password" autocomplete="current-password">
      </div>
      <button type="submit" class="al-btn" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Log In</button>
      <div class="al-status" id="loginError" role="alert" aria-live="polite"></div>
      <div class="al-status" id="sessionNote" role="status" aria-live="polite"></div>
    </form>

    <div class="al-back"><a href="index.html"><i class="fas fa-arrow-left"></i> Back to the website</a></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
    from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD89i0iqHXWY6mG1P1ErFkf8Otbunsx6LU",
    authDomain: "my-journal-a0eaa.firebaseapp.com",
    projectId: "my-journal-a0eaa",
    storageBucket: "my-journal-a0eaa.firebasestorage.app",
    messagingSenderId: "577249786861",
    appId: "1:577249786861:web:489745d30cd82b6ca6c5e4"
  };

  /* ============================================================
     ADMIN ACCOUNTS — the ONLY emails that may open the admin panel.
     To add or remove an administrator later, change this list here,
     in admin.html, AND in the Firestore rules (firestore-rules.txt).
     Comparison is case-insensitive and ignores surrounding spaces.
     ============================================================ */
  const ADMIN_EMAILS = [
    "ssbcpoint@gmail.com",
    "zulfiquarcyberlaw@gmail.com"
  ];
  const isAdminEmail = (e) => ADMIN_EMAILS.includes(String(e || "").trim().toLowerCase());

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const form = document.getElementById("loginForm");
  const loading = document.getElementById("alLoading");
  const errEl = document.getElementById("loginError");
  const noteEl = document.getElementById("sessionNote");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function showError(html) { errEl.className = "al-status error"; errEl.innerHTML = html; }
  function clearError() { errEl.className = "al-status"; errEl.innerHTML = ""; }
  function showNote(html) { noteEl.className = "al-status info"; noteEl.innerHTML = html; }
  function clearNote() { noteEl.className = "al-status"; noteEl.innerHTML = ""; }

  /* ---------------- session check ----------------
     • administrator already signed in → straight to the panel
     • non-admin signed in             → notice; they may sign in
       below with an administrator account
     • signed out                      → just show the form       */
  onAuthStateChanged(auth, (user) => {
    loading.style.display = "none";
    form.style.display = "block";
    if (!user) { clearNote(); return; }
    if (isAdminEmail(user.email)) {
      showNote('<i class="fas fa-check-circle"></i> Welcome back — opening the admin panel...');
      setTimeout(() => { location.href = "admin.html"; }, 300);
      return;
    }
    showNote('<i class="fas fa-user-lock"></i> You are currently signed in as <b>' + esc(user.email) +
      '</b>, but this account does not have administrator access. To open the admin panel, sign in below with an administrator account.');
  });

  /* ---------------- sign in ---------------- */
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value.trim();
    const pw = document.getElementById("loginPassword").value;
    const btn = document.getElementById("loginBtn");
    clearError();
    if (!email || !pw) {
      showError('<i class="fas fa-exclamation-circle"></i> Please enter both your email address and your password.');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Logging in...';
    try {
      const cred = await signInWithEmailAndPassword(auth, email, pw);
      if (!isAdminEmail(cred.user.email)) {
        /* the password was correct, but this is NOT an administrator —
           reject the login and close the session again (fail-closed) */
        try { await signOut(auth); } catch (so) { console.warn("[ARC admin-login] signOut:", so); }
        showError('<i class="fas fa-times-circle"></i> <b>This account does not have administrator access.</b>' +
          ' Only the site administrators can open the admin panel.');
        return;
      }
      location.href = "admin.html";
    } catch (err) {
      console.error("[ARC admin-login]", err);
      const code = (err && err.code) || "";
      const map = {
        "auth/invalid-credential": "The email or password is incorrect.",
        "auth/wrong-password": "The email or password is incorrect.",
        "auth/user-not-found": "The email or password is incorrect.",
        "auth/invalid-email": "That does not look like a valid email address.",
        "auth/too-many-requests": "Too many attempts — please wait a moment and try again.",
        "auth/network-request-failed": "A network error occurred. Please check your internet connection and try again.",
        "auth/operation-not-allowed": "Email/Password sign-in is not enabled in Firebase (Console → Authentication → Sign-in method)."
      };
      const msg = map[code] || "Login failed: " + String((err && err.message) || err).replace("Firebase: ", "");
      showError('<i class="fas fa-times-circle"></i> ' + esc(msg));
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Log In';
    }
  });
</script>
</body>
</html>
